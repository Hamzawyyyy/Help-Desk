{% extends 'base.html' %}
{% block title %}Register · HelpDesk{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-7 col-lg-6">
<div class="card shadow-sm"><div class="card-body p-4">
<h1 class="h3 mb-3">Create an account</h1>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label class="form-label" for="username">Username</label>
<input class="form-control" id="username" name="username" required minlength="3" maxlength="80" value="{{ request.form.get('username', '') }}" autocomplete="username">
<div class="form-text mb-3">3–80 letters, numbers or underscores.</div>
<label class="form-label" for="email">Email</label>
<input class="form-control mb-3" id="email" name="email" type="email" required maxlength="254" value="{{ request.form.get('email', '') }}" autocomplete="email">
<label class="form-label" for="password">Password (8–128 characters)</label>
<input class="form-control mb-3" id="password" name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password">
<button class="btn btn-primary w-100">Register</button>
</form>
<p class="mt-3 mb-0 text-center small">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div></div>
</div>
</div>
{% endblock %}
