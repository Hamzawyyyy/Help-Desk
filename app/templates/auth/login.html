{% extends 'base.html' %}
{% block title %}Log in · HelpDesk{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-6 col-lg-5">
<div class="card shadow-sm"><div class="card-body p-4">
<h1 class="h3 mb-3">Log in</h1>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label class="form-label" for="email">Email</label>
<input class="form-control mb-3" id="email" name="email" type="email" required autocomplete="email">
<label class="form-label" for="password">Password</label>
<input class="form-control mb-3" id="password" name="password" type="password" required maxlength="128" autocomplete="current-password">
<button class="btn btn-primary w-100">Log in</button>
</form>
<p class="mt-3 mb-0 text-center small">No account yet? <a href="{{ url_for('auth.register') }}">Register</a></p>
</div></div>
</div>
</div>
{% endblock %}
