{% extends 'base.html' %}
{% block title %}Create ticket · HelpDesk{% endblock %}
{% block content %}
<a href="{{ url_for('tickets.list_tickets') }}">Back to tickets</a>
<h1 class="mt-3">Create a ticket</h1>
{% if errors %}<div class="alert alert-danger" role="alert"><ul class="mb-0">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}
<form method="post" class="col-lg-8">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label class="form-label" for="title">Title</label>
<input class="form-control mb-3" id="title" name="title" required maxlength="200" value="{{ request.form.get('title', '') }}">
<label class="form-label" for="description">Description</label>
<textarea class="form-control mb-3" id="description" name="description" required maxlength="10000" rows="6">{{ request.form.get('description', '') }}</textarea>
<label class="form-label" for="category">Category</label>
<select class="form-select mb-3" id="category" name="category" required><option value="">Choose a category</option>{% for category in categories %}<option value="{{ category }}" {% if request.form.get('category') == category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select>
<label class="form-label" for="priority">Priority</label>
<select class="form-select mb-3" id="priority" name="priority" required><option value="">Choose a priority</option>{% for priority in priorities %}<option value="{{ priority }}" {% if request.form.get('priority') == priority %}selected{% endif %}>{{ priority }}</option>{% endfor %}</select>
<button class="btn btn-primary">Create ticket</button>
</form>
{% endblock %}
