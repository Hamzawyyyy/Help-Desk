{% extends 'base.html' %}
{% block title %}Log in · HelpDesk{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" class="col-md-6">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label class="form-label" for="email">Email</label>
<input class="form-control mb-3" id="email" name="email" type="email" required autocomplete="email">
<label class="form-label" for="password">Password</label>
<input class="form-control mb-3" id="password" name="password" type="password" required maxlength="128" autocomplete="current-password">
<button class="btn btn-primary">Log in</button>
</form>
{% endblock %}
