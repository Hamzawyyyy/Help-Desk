<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HelpDesk{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="{{ url_for('home') }}">HelpDesk</a><div class="d-flex gap-3 align-items-center">
{% if current_user.is_authenticated %}
<span class="text-white">{{ current_user.username }}</span>
<form method="post" action="{{ url_for('auth.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-outline-light btn-sm">Log out</button></form>
{% else %}<a class="text-white" href="{{ url_for('auth.login') }}">Log in</a><a class="text-white" href="{{ url_for('auth.register') }}">Register</a>{% endif %}
</div></div></nav>
  <main class="container py-5">{% for category, message in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{ category }}" role="alert">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
