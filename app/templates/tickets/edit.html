{% extends 'base.html' %}
{% block title %}Edit ticket #{{ ticket.id }} · HelpDesk{% endblock %}
{% block content %}
<a href="{{ url_for('tickets.ticket_detail', ticket_id=ticket.id) }}">Back to ticket</a>
<h1 class="mt-3">Edit ticket #{{ ticket.id }}</h1>
{% if errors %}<div class="alert alert-danger" role="alert"><ul class="mb-0">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}
<form method="post" class="col-lg-8">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label class="form-label" for="title">Title</label>
<input class="form-control mb-3" id="title" name="title" required maxlength="200" value="{{ values.title }}">
<label class="form-label" for="description">Description</label>
<textarea class="form-control mb-3" id="description" name="description" required maxlength="10000" rows="6">{{ values.description }}</textarea>
<label class="form-label" for="category">Category</label>
<select class="form-select mb-3" id="category" name="category" required>{% for category in categories %}<option value="{{ category }}" {% if values.category == category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select>
<label class="form-label" for="priority">Priority</label>
<select class="form-select mb-3" id="priority" name="priority" required>{% for priority in priorities %}<option value="{{ priority }}" {% if values.priority == priority %}selected{% endif %}>{{ priority }}</option>{% endfor %}</select>
<button class="btn btn-primary">Save changes</button>
</form>
{% endblock %}
